# Local development stack: Odoo 19 Community + PostgreSQL 16.
# Copy .env.example to .env and change POSTGRES_PASSWORD before the first run.
# The repo root is mounted at /mnt/extra-addons because the six addons live there.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      # The whole repo is mounted: assetflow_* addons sit at the repo root, not in an addons/ folder.
      - ./:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    command: ["odoo", "--dev=all"]

volumes:
  db-data:
  odoo-data:
